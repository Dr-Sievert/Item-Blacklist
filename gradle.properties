# Mod identity. Every key here can be used as ${key} in the loader metadata and the mixin
# config; the build replaces it (build-logic, mod.base).
# version is the mod's own: the jars are <mod_id>-<loader>-<line module>-<version>.jar.
version=2.0.0
group=net.sievert.item_blacklist
mod_id=item_blacklist
mod_name=Item Blacklist
mod_license=MIT
mod_description=This mod lets you blacklist items from survival gameplay!
mod_author=Dr-Sievert
mod_sources=https://github.com/Dr-Sievert/Item-Blacklist
mod_issues=https://github.com/Dr-Sievert/Item-Blacklist/issues

# The Minecraft release scripts/run.py and the IDE's Server (devVersion) boot by default
# (any release of the boot list; python scripts/run.py --list shows them).
devVersion=26.2

# The Java Gradle runs on; each module compiles with its line's java_version (CLAUDE.md,
# "Toolchain"). gradle/gradle-daemon-jvm.properties repeats it for IntelliJ.
buildJdk=25

# JUnit, for the unit tests in the game part's src/test (build-logic, mod.base).
junit_version=6.1.3

# Per module. A module reads "<module>.<key>" (v1_21_6), then "<its line module>.<key>" (l1_21
# or l26), then "<key>". Only its own line's and module's keys reach its metadata, without the
# prefix: so ${java_version} is 21 in a 1.21.x jar and 25 in a 26.x jar. Every version below
# was resolved live when the project was generated (CLAUDE.md, "Finding a release's pins").

# The 1.21.x line: l1_21 compiles at the floor, 1.21.1, and builds the line's jars, which serve
# 1.21.1 to 1.21.11 and declare exactly that.
l1_21.java_version=21
l1_21.minecraft_version=1.21.1
l1_21.fabric_minecraft_range=>=1.21.1 <=1.21.11
l1_21.neoforge_minecraft_range=[1.21.1,1.21.11]
l1_21.fabric_loader_version=0.19.5
l1_21.fabric_api_version=0.116.17+1.21.1
l1_21.neoforge_version=21.1.252
l1_21.neo_form_version=1.21.1-20240808.144430
l1_21.sponge_mixin_version=0.15.2+mixin.0.8.7
l1_21.mixinextras_version=0.5.3
l1_21.asm_tree_version=9.6
l1_21.jei_minecraft=1.21.1
l1_21.jei_version=19.57.0.450
# The line's dev runs load JEI (the JEI pair above) and JER, which builds per loader: JER's
# CurseForge file ids, through CurseMaven. Both are JER 1.6.0.17 for 1.21.1. JER's Fabric jars
# for 1.21.1 (1.6.0.12 too) lack JER's own package jeresources.api, which its classes name, so
# the mixin check lists the LootDrop target absent there.
l1_21.jer_fabric_file=6506299
l1_21.jer_neoforge_file=6506298
# JEI's library MezzConfig, for the Fabric dev runs: JEI 19 nests it, Loom strips the nested
# jars of a mod it remaps, and JEI's POM does not name it. The build JEI 19.57.0.450 nests.
l1_21.mezz_config_version=0.5.12

# The 1.21.x version modules, one per release above the floor at which a window of the code
# starts (1.21.3, 1.21.7, 1.21.8 and 1.21.10 have none: CLAUDE.md, "Bringing a version module
# back"): each compiles the same sources against its release and ships its own src/since<release>
# folders in the line's jars.
v1_21_2.minecraft_version=1.21.2
v1_21_2.neo_form_version=1.21.2-20241022.151510
v1_21_2.fabric_api_version=0.106.1+1.21.2
v1_21_2.neoforge_version=21.2.1-beta
v1_21_4.minecraft_version=1.21.4
v1_21_4.neo_form_version=1.21.4-20241203.161809
v1_21_4.fabric_api_version=0.119.4+1.21.4
v1_21_4.neoforge_version=21.4.158
v1_21_4.jei_minecraft=1.21.4
v1_21_4.jei_version=20.0.0.4
v1_21_5.minecraft_version=1.21.5
v1_21_5.neo_form_version=1.21.5-20250325.162830
v1_21_5.fabric_api_version=0.128.2+1.21.5
v1_21_5.neoforge_version=21.5.98
v1_21_5.jei_minecraft=1.21.5
v1_21_5.jei_version=21.4.0.27
v1_21_6.minecraft_version=1.21.6
v1_21_6.neo_form_version=1.21.6-20250617.151856
v1_21_6.fabric_api_version=0.128.2+1.21.6
v1_21_6.jei_minecraft=1.21.5
v1_21_6.jei_version=21.4.0.27
v1_21_9.minecraft_version=1.21.9
v1_21_9.neo_form_version=1.21.9-20250930.151910
v1_21_9.neoforge_version=21.9.16-beta
v1_21_9.jei_minecraft=1.21.9
v1_21_9.jei_version=25.0.1.4
v1_21_11.minecraft_version=1.21.11
v1_21_11.neo_form_version=1.21.11-20251209.172050
v1_21_11.fabric_api_version=0.141.6+1.21.11
v1_21_11.neoforge_version=21.11.45
v1_21_11.jei_minecraft=1.21.11
v1_21_11.jei_version=27.44.0.104

# The 26.x line: l26 compiles at the floor, 26.1.2, and builds the line's jars, which serve 26.1.2
# to 26.2 and declare 26.1.2 up to the ceiling's hotfixes.
l26.java_version=25
l26.minecraft_version=26.1.2
l26.fabric_minecraft_range=>=26.1.2 <26.3-
l26.neoforge_minecraft_range=[26.1.2,26.3-alpha)
l26.fabric_loader_version=0.19.5
l26.fabric_api_version=0.155.3+26.1.2
l26.neoforge_version=26.1.2.112
l26.neo_form_version=26.1.2-1
l26.sponge_mixin_version=0.17.3+mixin.0.8.7
l26.mixinextras_version=0.5.4
l26.asm_tree_version=9.8
l26.jei_minecraft=26.1.2
l26.jei_version=29.43.0.106
# The line's dev runs load JEI (the JEI pair above) and JER: JER's CurseForge file ids, through
# CurseMaven. Both are JER 1.10.1.40 for 26.1.2.
l26.jer_fabric_file=8522653
l26.jer_neoforge_file=8522652

# The 26.x version modules, one per drop above the floor, at the drop's newest release: each
# compiles the same sources against its release and ships its own src/since<drop> folders in the
# line's jars.
v26_2.minecraft_version=26.2
v26_2.neo_form_version=26.2-2
v26_2.fabric_api_version=0.161.0+26.2
v26_2.neoforge_version=26.2.0.88
v26_2.jei_minecraft=26.2
v26_2.jei_version=30.38.0.231

# Which line IntelliJ edits with full resolution: its line modules own the shared src/main
# and src/gametest, so the shared code and that line's folders resolve against that line's
# game jar; the other line's folders show the shared classes as unresolved until this is
# switched and Gradle synced again (CLAUDE.md, "Editing the other line in IntelliJ"). 26 or
# 1_21; a one-line project names its line. It moves only folder ownership: `build` gives the
# same jars for either value. The unit tests run in that line's module.
ideLine=26

# Gradle. Configuration cache, parallel and caching as the loaders' MDKs have them. The heap:
# Gradle sets up Minecraft for many modules in parallel; 3 GB ran out.
# No org.gradle.java.installations.paths: it names folders on one machine, so gw.cmd and
# gw.sh pass it.
org.gradle.jvmargs=-Xmx6G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

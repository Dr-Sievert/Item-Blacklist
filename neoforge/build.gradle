plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

repositories {
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    compileOnly "curse.maven:just-enough-resources-jer-240630:${jer_neoforge_file}"
    runtimeOnly "curse.maven:just-enough-resources-jer-240630:${jer_neoforge_file}"
}

neoForge {
    version = neoforge_version

    def at = project(':common').file(
            'src/main/resources/META-INF/accesstransformer.cfg'
    )

    if (at.exists()) {
        accessTransformers.from(
                at.absolutePath
        )
    }

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            systemProperty(
                    'neoforge.enabledGameTestNamespaces',
                    mod_id
            )

            ideName =
                    "NeoForge ${it.name.capitalize()} (${project.path})"

            logLevel =
                    org.slf4j.event.Level.DEBUG
        }

        client {
            client()
        }

        data {
            data()

            programArguments.addAll(
                    '--mod',
                    project.mod_id,
                    '--all',
                    '--output',
                    file('src/generated/resources/').getAbsolutePath(),
                    '--existing',
                    file('src/main/resources/').getAbsolutePath()
            )
        }

        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}